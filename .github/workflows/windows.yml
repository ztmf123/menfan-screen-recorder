name: Windows build
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      publish_beta:
        description: Publish the current Beta after checks pass
        required: false
        default: false
        type: boolean
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Install media tools
        shell: pwsh
        run: ./scripts/setup.ps1 -SkipSdk
      - name: Build and exercise media pipeline
        shell: pwsh
        run: ./scripts/test.ps1
      - name: Publish Windows x64
        shell: pwsh
        run: ./scripts/publish.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: Menfan-Screen-Recorder-win-x64
          path: |
            artifacts/Menfan-Screen-Recorder-v*-win-x64.zip
            artifacts/Menfan-Screen-Recorder-v*-win-x64.zip.sha256
  release:
    needs: build
    if: >-
      github.ref == 'refs/heads/main' &&
      ((github.event_name == 'push' && startsWith(github.event.head_commit.message, 'Release v')) ||
       (github.event_name == 'workflow_dispatch' && inputs.publish_beta))
    runs-on: windows-2022
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: Menfan-Screen-Recorder-win-x64
          path: release-artifacts
      - name: Publish checked Beta archive
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_PROMPT_DISABLED: '1'
          REPLACE_RELEASE: ${{ contains(github.event.head_commit.message, '[replace]') }}
        run: |
          [xml]$project = Get-Content src/Menfan.App/Menfan.App.csproj -Raw
          $releaseVersion = [string]$project.Project.PropertyGroup.Version
          if ($releaseVersion -notmatch '^\d+\.\d+\.\d+-beta\.\d+$') { throw 'This job publishes Beta versions only.' }
          $tag = "v$releaseVersion"
          $zip = "release-artifacts/Menfan-Screen-Recorder-$tag-win-x64.zip"
          $checksum = "$zip.sha256"
          if (!(Test-Path -LiteralPath $zip) -or !(Test-Path -LiteralPath $checksum)) { throw 'Release files missing.' }
          $expected = (Get-Content -LiteralPath $checksum -Raw).Split(' ', [StringSplitOptions]::RemoveEmptyEntries)[0]
          if ((Get-FileHash -LiteralPath $zip -Algorithm SHA256).Hash -ne $expected) { throw 'Release checksum mismatch.' }
          gh release view $tag --repo $env:GITHUB_REPOSITORY 2>$null
          if ($LASTEXITCODE -eq 0) {
            if ($env:REPLACE_RELEASE -ne 'true') { Write-Host "$tag already exists; leaving it unchanged."; exit 0 }
            gh api --method PATCH "repos/$env:GITHUB_REPOSITORY/git/refs/tags/$tag" -f sha=$env:GITHUB_SHA -F force=true
            if ($LASTEXITCODE -ne 0) { throw 'Could not update the replaced Beta tag.' }
            gh release upload $tag $zip $checksum --repo $env:GITHUB_REPOSITORY --clobber
            if ($LASTEXITCODE -ne 0) { throw 'Could not replace Beta assets.' }
            gh release edit $tag --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --notes-file RELEASE_NOTES.md --prerelease
            if ($LASTEXITCODE -ne 0) { throw 'Could not update Beta notes.' }
            exit 0
          }
          gh release create $tag $zip $checksum --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --title "Menfan Screen Recorder $tag" --notes-file RELEASE_NOTES.md --prerelease
          if ($LASTEXITCODE -ne 0) { throw 'Beta publication failed.' }
